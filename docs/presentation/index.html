<style>
  :root{
    --bg1:#1e1b4b; --bg2:#4c1d95; --bg3:#0f172a;

    --text-dim: rgba(244,242,255,0.72);
    --text-dimmer: rgba(244,242,255,0.5);

    --accent2: #f472b6;
    --accent3: #34d399;
    --accent4: #fbbf24;
    --danger:#f87171;

  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    font-family: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    background: radial-gradient(1200px 800px at 10% 10%, var(--bg2), transparent),
                radial-gradient(1200px 900px at 90% 90%, var(--bg1), transparent),
                linear-gradient(160deg, var(--bg3), #1e1140 60%, var(--bg1));
    background-color:#0f0c29;
  }
  .blobs{position:fixed; inset:0; z-index:0; overflow:hidden; filter:blur(70px); opacity:.55;}
  .blob{position:absolute; border-radius:50%; will-change:transform;}
  .blob1{width:44vw;height:44vw; left:-10%; top:-10%; background:#7c3aed; animation:drift1 34s ease-in-out infinite;}
  .blob2{width:38vw;height:38vw; right:-8%; top:5%; background:#db2777; animation:drift2 40s ease-in-out infinite;}
  .blob3{width:40vw;height:40vw; left:20%; bottom:-18%; background:#059669; animation:drift3 46s ease-in-out infinite;}
  .blob4{width:30vw;height:30vw; right:15%; bottom:-10%; background:#2563eb; animation:drift4 38s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(8vw,10vh) scale(1.15);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-9vw,8vh) scale(0.9);}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6vw,-9vh) scale(1.1);}}
  @keyframes drift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-7vw,-6vh) scale(1.2);}}

  .deck{position:fixed; inset:0; z-index:1;}
  .slide{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding: 64px 6vw 90px;
    opacity:0; pointer-events:none;
    transform: translateX(60px) scale(.94) rotateY(-6deg);
    transition: opacity .6s cubic-bezier(.22,.9,.32,1), transform .6s cubic-bezier(.22,.9,.32,1);
    perspective: 1400px;
  }
  .slide.prev{ transform: translateX(-60px) scale(.94) rotateY(6deg); opacity:0;}
  .slide.active{ opacity:1; pointer-events:auto; transform: translateX(0) scale(1) rotateY(0deg); z-index:2;}
  .slide-inner{ width:100%; max-width:1280px; max-height:100%; overflow-y:auto; overflow-x:hidden; padding: 4px 10px 20px;}
  .slide-inner::-webkit-scrollbar{width:8px;}
  .slide-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:8px;}

  .glass{
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .panel{ padding: 28px 34px; }

  .reveal{ opacity:0; transform: translateY(22px); transition: opacity .55s ease, transform .55s ease; }
  .slide.active .reveal{ opacity:1; transform:translateY(0); }
  .slide.active .r1{transition-delay:.05s;} .slide.active .r2{transition-delay:.14s;}
  .slide.active .r3{transition-delay:.23s;} .slide.active .r4{transition-delay:.32s;}
  .slide.active .r5{transition-delay:.41s;} .slide.active .r6{transition-delay:.50s;}
  .slide.active .r7{transition-delay:.59s;} .slide.active .r8{transition-delay:.68s;}
  .slide.active .r9{transition-delay:.77s;} .slide.active .r10{transition-delay:.86s;}
  .slide.active .r11{transition-delay:.95s;} .slide.active .r12{transition-delay:1.04s;}

  h1{font-size: clamp(30px,4vw,52px); font-weight:800; letter-spacing:-.02em; line-height:1.05;
     background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h2{font-size: clamp(22px,2.6vw,34px); font-weight:800; letter-spacing:-.01em; margin-bottom:14px; color:#fff;}
  h3{font-size:18px; font-weight:700; margin-bottom:6px;}
  p, li{font-size:15.5px; line-height:1.55; color:var(--text-dim);}
  .kicker{ text-transform:uppercase; letter-spacing:.18em; font-size:12px; font-weight:700; color:var(--accent);}
  .lead{font-size:17px; color:var(--text-dim); margin-top:10px; max-width:64ch;}
  ul{padding-left:20px;} li{margin-bottom:8px;}
  .grid{display:grid; gap:18px;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}
  .card{padding:18px 20px;}
  .badge{display:inline-block; padding:3px 12px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:.04em; background:rgba(255,255,255,.12); border:1px solid var(--glass-border);}
  .tag{color:var(--accent3);}
  .mono{font-family:"Cascadia Code","Consolas",monospace; font-size:13px; background:rgba(0,0,0,.28); padding:2px 8px; border-radius:6px;}

  /* top progress bar */
  #topbar{position:fixed; top:0; left:0; right:0; height:4px; z-index:50; background:rgba(255,255,255,.08);}
  #topfill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3)); transition:width .5s ease;}

  /* footer */
  #footer{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:10px 22px; gap:14px;}
  #footer .glass{padding:8px 16px; display:flex; align-items:center; gap:10px; font-size:13px;}
  #dots{display:flex; gap:6px; flex-wrap:wrap; max-width:44vw;}
  .dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.28); cursor:pointer; transition:.25s;}
  .dot.active{background:var(--accent); width:22px; border-radius:6px;}
  .dot.p2{ }
  .navbtn{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px; user-select:none;}
  .navbtn:hover{background:var(--glass-bg-strong);}
  #timer{font-variant-numeric:tabular-nums; font-weight:700;}
  #timer.amber{color:var(--accent4);} #timer.red{color:var(--danger); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  /* speaker notes overlay */
  #notes{position:fixed; inset:0; z-index:80; display:none; align-items:flex-end; justify-content:center; padding:40px;}
  #notes.show{display:flex;}
  #notes .panel{max-width:820px; width:100%; max-height:60vh; overflow:auto;}
  #notes h3{color:var(--accent4);}
  #notes ul{margin-top:8px;}

  #helpToast{position:fixed; top:16px; right:16px; z-index:90; font-size:12px; padding:8px 14px; opacity:.85;}

  /* generic component styles */
  .flow{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
  .node{padding:16px 20px; text-align:center; min-width:130px;}
  .arrow{font-size:22px; color:var(--accent); animation:arrowpulse 1.6s infinite;}
  @keyframes arrowpulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  .counter{font-size:44px; font-weight:800; background:linear-gradient(90deg,var(--accent3),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .barwrap{background:rgba(255,255,255,.1); border-radius:100px; height:14px; overflow:hidden; margin-top:8px;}
  .barfill{height:100%; border-radius:100px; width:0%; background:linear-gradient(90deg,var(--accent3),var(--accent)); transition:width 1.4s cubic-bezier(.22,.9,.32,1);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid rgba(255,255,255,.12);}
  th{color:var(--accent); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;}
  tr.pass td:first-child::before{content:"✓ "; color:var(--accent3);}
  tr.fail td:first-child::before{content:"✕ "; color:var(--danger);}

  .shot{aspect-ratio:16/10; border-radius:14px; overflow:hidden; position:relative; background:rgba(0,0,0,.25); border:1px solid var(--glass-border);}
  .shot img{width:100%; height:100%; object-fit:cover; object-position:top;}
  .shot .cap{position:absolute; left:0; right:0; bottom:0; padding:6px 10px; font-size:11.5px; background:linear-gradient(0deg,rgba(0,0,0,.65),transparent); }
  .shot.missing img{display:none;}
  .shot.missing::after{content:attr(data-label); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-size:12px; color:var(--text-dimmer); border:1px dashed rgba(255,255,255,.25);}

  code.small{font-size:12px;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:900px){.split{grid-template-columns:1fr;}}

  svg text{fill:var(--text); font-family:inherit;}
  .cfgpath{fill:none; stroke-width:3; stroke-linecap:round;}
</style>

<script>

const SHOT = (name,label)=>`<div class="shot" data-label="${label}"><img src="../screenshots/${name}" alt="${label}" onerror="this.closest('.shot').classList.add('missing')"><div class="cap">${label}</div></div>`;

const SLIDES = [
// ---------------- PART 1 ----------------
{presenter:1, html:`
  <div class="glass panel" style="text-align:center; padding:60px 50px;">

    <h1 class="reveal r2" style="margin-top:14px;">Outfleek</h1>
    <p class="lead reveal r3" style="margin:16px auto;">A production e-commerce platform built for the Bangladeshi market — storefront, admin panel, and Facebook-ad landing-page builder in one Next.js + Convex codebase.</p>
    <div class="grid g2 reveal r4" style="max-width:640px;margin:26px auto 0;">
      <div class="glass card"><h3>${PRESENTER_1.name}</h3><p>Roll ${PRESENTER_1.roll} — ${PRESENTER_1.part}</p></div>
      <div class="glass card"><h3>${PRESENTER_2.name}</h3><p>Roll ${PRESENTER_2.roll} — ${PRESENTER_2.part}</p></div>
    </div>
    <p class="reveal r5" style="margin-top:22px; font-size:13px; color:var(--text-dimmer);">Dhaka International University · Submitted to Md. Didar Ahmed, Lecturer · Group 4</p>
  </div>`,
  notes:["Welcome the audience and course instructor.","State the project name and one-sentence pitch: a real, deployed BD e-commerce platform.","Introduce both presenters and the two-part split (product/architecture, then testing/QA).","Mention it's live and open-source — repo + live URL come at the end.","Set expectations: 10 minutes each, ~20 total."]},

{presenter:1, html:`
  <div class="glass panel">
    <div class="kicker reveal r1">02 · The Problem</div>
    <h2 class="reveal r2">Selling online in Bangladesh is still broken</h2>
    <div class="grid g2" style="margin-top:10px;">
      <div class="glass card reveal r3"><h3>📘 Facebook-page-only selling</h3><p>Most small sellers take orders through Messenger comments/DMs — no real storefront, no catalog, no cart.</p></div>
      <div class="glass card reveal r4"><h3>💵 No COD-friendly checkout</h3><p>Off-the-shelf carts assume card payment. Bangladesh runs on Cash on Delivery and manual bKash — rarely supported well.</p></div>
      <div class="glass card reveal r5"><h3>📉 No ad tracking</h3><p>Sellers boost posts blind — no Pixel, no server-side events, no idea which ad actually converts.</p></div>
      <div class="glass card reveal r6"><h3>📋 Manual order handling</h3><p>Orders tracked in spreadsheets or notebooks; no status workflow, no abandoned-checkout recovery, no invoices.</p></div>
    </div>
    <p class="lead reveal r7" style="margin-top:16px;">Outfleek exists to fix all four at once — for a real seller, with a real product line.</p>
  </div>`,
  notes:["Frame the local context: BD sellers largely operate through Facebook pages, not proper stores.","COD dominates payment — most platforms are built card-first and don't fit.","Ad spend is wasted without pixel/CAPI tracking — sellers can't tell which ad works.","Order management is manual — no workflow, no recovery of abandoned checkouts.","Transition: 'so we built a platform that solves all four.'"]},

{presenter:1, html:`
  <div class="glass panel">
    <div class="kicker reveal r1">03 · The Solution</div>
    <h2 class="reveal r2">One codebase, three surfaces</h2>
    <div class="grid g3" style="margin-top:6px;">
      <div class="glass card reveal r3"><div class="badge">Surface 1</div><h3 style="margin-top:10px;">Storefront</h3><p>Home = product listing, product detail with variants/stock, cart drawer, checkout with COD + bKash, order tracking.</p></div>
      <div class="glass card reveal r4"><div class="badge">Surface 2</div><h3 style="margin-top:10px;">Admin Panel</h3><p>Dashboard, order workflow + bKash verification, product/category/promo CRUD, abandoned-checkout call list, settings.</p></div>
      <div class="glass card reveal r5"><div class="badge">Surface 3</div><h3 style="margin-top:10px;">Landing-Page Builder</h3><p>One-page Facebook-ad funnels at <span class="mono">/l/&lt;slug&gt;</span> — 8 toggleable sections + inline order form.</p></div>
    </div>
    <p class="lead reveal r6" style="margin-top:18px;">Built with Next.js 15 App Router + TypeScript on top of Convex for backend, database, file storage and scheduling — deployed on Vercel + Convex Cloud.</p>
  </div>`,
  notes:["Introduce the three-surface architecture as the core pitch.","Storefront: home page doubles as the listing — no separate catalog page needed.","Admin: full operational control, not just a CMS — order workflow, bKash verification, invoices.","Landing builder is the standout feature — teased here, detailed later in slide 10.","Name the stack briefly; full breakdown is next slide."]},

{presenter:1, html:`
  <div class="glass panel">
    <div class="kicker reveal r1">04 · Tech Stack</div>
    <h2 class="reveal r2">Why these tools</h2>
    <div class="grid g4" style="margin-top:6px;">
      <div class="glass card reveal r3"><h3>Next.js 15</h3><p>App Router, server components, one deploy for storefront + admin + landing pages.</p></div>
      <div class="glass card reveal r4"><h3>TypeScript</h3><p>End-to-end types from DB schema to UI — catches pricing/shape bugs at compile time.</p></div>
      <div class="glass card reveal r5"><h3>Convex</h3><p>Backend, database, file storage and scheduler in one reactive platform — no separate API layer.</p></div>
      <div class="glass card reveal r6"><h3>Framer Motion</h3><p>Cart drawer slide-ins, gallery transitions, micro-interactions that feel native.</p></div>
      <div class="glass card reveal r7"><h3>Tailwind CSS v4</h3><p>Fast, consistent styling across three very different surfaces.</p></div>
      <div class="glass card reveal r8"><h3>Zustand</h3><p>Lightweight client state for cart/UI without Redux boilerplate.</p></div>
      <div class="glass card reveal r9"><h3>Vercel</h3><p>Zero-config edge deploys, previews per PR.</p></div>
      <div class="glass card reveal r10"><h3>Convex Cloud</h3><p>Managed realtime backend — mutations, queries, scheduled jobs, storage.</p></div>
    </div>
  </div>`,
  notes:["Walk the grid left to right — one breath per card, don't over-explain.","Emphasize Convex as the unusual choice: replaces API routes + DB + cron with one system.","TypeScript end-to-end is a QA point you'll reference again in Part 2 (testability).","Framer Motion for the cart drawer/gallery — visual polish, not just structure.","Close: 'all of this deploys as two connected services — Vercel and Convex Cloud.'"]},

{presenter:1, html:`
  <div class="glass panel">
    <div class="kicker reveal r1">05 · Architecture</div>
    <h2 class="reveal r2">Request flow, end to end</h2>
    <svg viewBox="0 0 900 220" style="width:100%;height:auto;margin-top:10px;" id="archsvg">
      <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/></marker></defs>

        <rect x="255" y="80" width="170" height="60" rx="14" fill="rgba(244,114,182,.18)" stroke="#f472b6"/>
        <text x="340" y="105" text-anchor="middle">Next.js 15</text><text x="340" y="123" text-anchor="middle" font-size="11" opacity=".7">App Router · Vercel</text>

        <rect x="520" y="80" width="170" height="60" rx="14" fill="rgba(52,211,153,.18)" stroke="#34d399"/>
        <text x="605" y="105" text-anchor="middle">Convex</text><text x="605" y="123" text-anchor="middle" font-size="11" opacity=".7">DB · Storage · Scheduler</text>

        <rect x="750" y="80" width="140" height="60" rx="14" fill="rgba(251,191,36,.18)" stroke="#fbbf24"/>
        <text x="820" y="105" text-anchor="middle">Meta CAPI</text><text x="820" y="123" text-anchor="middle" font-size="11" opacity=".7">scheduled event</text>

        <path d="M160,110 L253,110" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)" class="flowline"/>
        <path d="M425,110 L518,110" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow)" class="flowline"/>
        <path d="M690,110 L748,110" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)" class="flowline"/>

    <div class="grid g3 reveal r4" style="margin-top:6px;">
      <div class="glass card"><p><b>1.</b> Browser renders storefront/admin pages and fires the client Meta Pixel.</p></div>

{presenter:1, html:`
  <div class="glass panel">

      </div>
    </div>
    <p class="lead reveal r5" style="margin-top:14px;">We applied both to Outfleek: black box on user-facing flows (checkout form), white box on extracted pure-logic modules (pricing, validation).</p>

/* ---------- render slides ---------- */
const deckEl = document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className='slide'; el.id='slide-'+i;
  el.innerHTML = `<div class="slide-inner">${s.html}</div>`;
  deckEl.appendChild(el);
});
const dotsEl = document.getElementById('dots');
SLIDES.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className='dot'+(s.presenter===2?' p2':'');
  d.onclick=()=>goto(i);
  dotsEl.appendChild(d);
});

let current = 0;
function render(){
  SLIDES.forEach((s,i)=>{
    const el = document.getElementById('slide-'+i);
    el.classList.remove('active','prev');
    if(i===current) el.classList.add('active');
    else if(i<current) el.classList.add('prev');
  });
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===current));
  document.getElementById('topfill').style.width = ((current+1)/SLIDES.length*100)+'%';
  const s = SLIDES[current];
  const p = s.presenter===1?PRESENTER_1:PRESENTER_2;
  document.getElementById('presenterLabel').textContent = p.name;
  document.getElementById('slideCount').textContent = 'Slide '+(current+1)+' / '+SLIDES.length;
  renderNotes();
  runCounters();
}
function goto(i){ current = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }
function go(delta){ goto(current+delta); }

/* notes */
function renderNotes(){
  const s = SLIDES[current];
  document.getElementById('notesTitle').textContent = 'Slide '+(current+1)+' talking points';
  const list = document.getElementById('notesList');
  list.innerHTML = (s.notes||[]).map(n=>`<li>${n}</li>`).join('');
}
function toggleNotes(){ document.getElementById('notes').classList.toggle('show'); }

/* animated counters/bars — re-run each time slide becomes active */
function runCounters(){
  const active = document.getElementById('slide-'+current);
  if(!active) return;
  active.querySelectorAll('.counter').forEach(c=>{
    const target = parseFloat(c.dataset.target);
    let start=null;
    c.textContent='0';
    function step(ts){
      if(!start) start=ts;
      const p = Math.min(1,(ts-start)/1200);
      c.textContent=(target*p).toFixed(2);
      if(p<1) requestAnimationFrame(step); else c.textContent=target.toFixed(2);
    }
    requestAnimationFrame(step);
  });
  active.querySelectorAll('.barfill').forEach(b=>{
    b.style.width='0%';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ b.style.width=b.dataset.target+'%'; }));
  });
}

/* keyboard nav */
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
  else if(e.key.toLowerCase()==='n'){ toggleNotes(); }
  else if(e.key.toLowerCase()==='t'){ toggleTimer(); }
  else if(e.key.toLowerCase()==='r'){ resetTimer(); }
  else if(e.key.toLowerCase()==='f'){ toggleFullscreen(); }
  else if(/^[1-9]$/.test(e.key)){ const n=parseInt(e.key)-1; if(n<SLIDES.length) goto(n); }
});
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* swipe */
let touchX=null;
document.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
});

/* timer — resets automatically per-presenter segment when crossing into the other presenter */
let timerSeconds=0, timerRunning=false, timerInterval=null, lastPresenter=1;
function toggleTimer(){
  timerRunning = !timerRunning;
  if(timerRunning){
    timerInterval = setInterval(()=>{ timerSeconds++; updateTimerDisplay(); }, 1000);
  } else clearInterval(timerInterval);
}
function resetTimer(){ timerSeconds=0; updateTimerDisplay(); }
function updateTimerDisplay(){
  const m = String(Math.floor(timerSeconds/60)).padStart(2,'0');
  const s = String(timerSeconds%60).padStart(2,'0');
  const el = document.getElementById('timer');
  el.textContent = m+':'+s;
  el.classList.remove('amber','red');
  if(timerSeconds>=600) el.classList.add('red');
  else if(timerSeconds>=480) el.classList.add('amber');
}
/* auto-reset timer when switching presenters */
const origGoto = goto;
goto = function(i){
  origGoto(i);
  const s = SLIDES[current];
  if(s.presenter !== lastPresenter){ lastPresenter = s.presenter; timerSeconds=0; updateTimerDisplay(); }
};

/* reduced motion */
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.blob').forEach(b=>b.style.animation='none');
}

/* fade help toast */
setTimeout(()=>{ const t=document.getElementById('helpToast'); if(t) t.style.transition='opacity 1s'; if(t) t.style.opacity='0'; }, 6000);

render();
</script>
